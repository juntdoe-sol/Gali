[package]
name = "ore-layout"
version = "0.1.0"
edition = "2021"
publish = false

# Prints the byte layout of ORE's on-chain accounts so the TypeScript client can
# decode them exactly. ORE is built with Steel, not Anchor, so there is no IDL to
# generate from. Run this on a machine with crates.io access:
#
#   cd scripts/ore-layout && cargo run --release > ../ore-layout.json
#
# Everything it prints comes from ore-api itself, so the numbers cannot drift from
# the deployed program the way hand-counted offsets can.

[dependencies]
ore-api = "3.8"
solana-program = "2"
bytemuck = "1"
serde_json = "1"
