      #boot .track { width: 176px; height: 6px; border: 2px solid #2a4480; background: #0c1734; }
      #boot .bar { height: 100%; width: 15%; background: #ffcf4a; animation: boot 6s cubic-bezier(.1,.7,.3,1) forwards; }
