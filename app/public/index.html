    <style id="expo-reset">
      html, body { height: 100%; margin: 0; background: #070d20; }

      html, body, #root { height: 100%; height: 100dvh; }

      @font-face { font-family: 'PixelifySans_400Regular'; src: url(/fonts/PixelifySans_400Regular.woff2) format('woff2'); font-display: swap; }
      @font-face { font-family: 'PixelifySans_600SemiBold'; src: url(/fonts/PixelifySans_600SemiBold.woff2) format('woff2'); font-display: swap; }

      @font-face { font-family: 'Silkscreen_400Regular'; src: url(/fonts/Silkscreen_400Regular.woff2) format('woff2'); font-display: swap; }
      /* pixel cursors for mouse players */
      @media (hover: hover) and (pointer: fine) {
        html, body { cursor: url(/cursor.png) 0 0, auto; }
        [role=button], [role=tab], [role=link], [role=switch], [role=checkbox], a, button, canvas { cursor: url(/cursor-hand.png) 9 1, pointer !important; }
        input, textarea { cursor: text !important; }
        [aria-disabled=true] { cursor: url(/cursor.png) 0 0, not-allowed !important; }
      }
      ::selection { background: #ffcf4a; color: #2a1400; }
      /* pixel scrollbars */
      * { scrollbar-width: thin; scrollbar-color: #2e4d94 #060a1c; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: #060a1c; }
      ::-webkit-scrollbar-thumb { background: #2e4d94; border: 2px solid #060a1c; box-shadow: inset 2px 2px 0 #5f86d8, inset -2px -2px 0 #1b2f63; }
      ::-webkit-scrollbar-thumb:hover { background: #3a5cab; }
      ::-webkit-scrollbar-corner { background: #060a1c; }
      /* the frame draws the focus; keyboard focus gets a dashed ring from the kit */
      input:focus, textarea:focus, [tabindex]:focus { outline: none; }
      img, canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      }
      /* shown until React's first render replaces #root; the app draws the same splash, so the hand-over is invisible */
      #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: #070d20; }
      #boot .track { position: relative; width: 180px; height: 12px; background: #04060f; clip-path: polygon(0 2px, 2px 2px, 2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px)); }
      #boot .bar { position: absolute; left: 2px; top: 2px; bottom: 2px; width: 15%; background: #ffc93c; box-shadow: inset 0 2px 0 #fff1a6, inset 0 -2px 0 #d27a12; animation: boot 6s steps(24, end) forwards; }
      #boot .hint { font: 15px 'Jersey15_400Regular', monospace; letter-spacing: 2px; color: #8ea2cc; }
      @keyframes boot { to { width: 62%; } }
    </style>
