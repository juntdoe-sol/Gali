name: program

on:
  push:
    paths: ['programs/**', 'tests/**', 'Anchor.toml', 'Cargo.toml', '.github/workflows/program.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to devnet after tests'
        type: boolean
        default: false

env:
  SOLANA_VERSION: '2.1.21'
  ANCHOR_VERSION: '0.31.1'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor CLI
        run: cargo install --git https://github.com/coral-xyz/anchor --tag v${ANCHOR_VERSION} anchor-cli --locked --force
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: Program keypair
        env:
          PROGRAM_KEYPAIR: ${{ secrets.PROGRAM_KEYPAIR }}
        run: |
          mkdir -p target/deploy ~/.config/solana
          if [ -n "$PROGRAM_KEYPAIR" ]; then echo "$PROGRAM_KEYPAIR" > target/deploy/gali-keypair.json; fi
          solana-keygen new --no-bip39-passphrase -s -o ~/.config/solana/id.json --force
      - run: anchor build
      - run: anchor test --provider.cluster localnet
      - uses: actions/upload-artifact@v4
        with:
          name: gali-program
          path: |
            target/deploy/gali.so
            target/idl/gali.json
            target/types/gali.ts

  deploy-devnet:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: gali-program, path: target }
      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v${SOLANA_VERSION}/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Deploy
        env:
          DEPLOYER_KEYPAIR: ${{ secrets.DEPLOYER_KEYPAIR }}
          PROGRAM_KEYPAIR: ${{ secrets.PROGRAM_KEYPAIR }}
        run: |
          mkdir -p ~/.config/solana
          echo "$DEPLOYER_KEYPAIR" > ~/.config/solana/id.json
          echo "$PROGRAM_KEYPAIR" > program.json
          solana config set --url devnet
          solana program deploy target/deploy/gali.so --program-id program.json
          rm program.json
