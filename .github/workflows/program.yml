name: program

# Builds both programs from source and runs the test suite on a local validator,
# with the ore-mock fixture loaded at ORE's address (see scripts/test-local.sh).
on:
  push:
    branches: [main]
    paths:
      - 'programs/**'
      - 'tests/**'
      - 'target/idl/**'
      - 'scripts/test-local.sh'
      - 'scripts/run-tests.cjs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/program.yml'
  pull_request:
    paths:
      - 'programs/**'
      - 'tests/**'
  workflow_dispatch:

env:
  SOLANA_VERSION: '2.1.21'

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install the Solana CLI
        run: |
          curl -sSfL -o "$RUNNER_TEMP/solana.tar.bz2" \
            "https://github.com/anza-xyz/agave/releases/download/v${SOLANA_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          tar xjf "$RUNNER_TEMP/solana.tar.bz2" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/solana-release/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - name: Build both programs from source
        run: |
          cargo-build-sbf --manifest-path programs/gali/Cargo.toml
          cargo-build-sbf --manifest-path programs/ore-mock/Cargo.toml
      - name: Test wallet
        run: |
          mkdir -p ~/.config/solana
          solana-keygen new --no-bip39-passphrase -s -o ~/.config/solana/id.json --force
      - name: Tests
        run: bash scripts/test-local.sh
