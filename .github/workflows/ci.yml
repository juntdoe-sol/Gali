name: ci

# EAS release/signing remains manual; this workflow never deploys.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: python3 scripts/check-secrets.py --self-test
      - run: python3 scripts/check-secrets.py
      - run: npm ci --ignore-scripts
      - run: node scripts/check-dependencies.cjs .

  app:
    runs-on: ubuntu-24.04
    env:
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_RPC_URL: https://rpc.example.invalid
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: node ../scripts/check-dependencies.cjs app
      - run: node ../scripts/check-build-hardening.cjs
      - run: npx tsc --noEmit
      - name: Android bundle
        run: npx expo export --clear --platform android --output-dir "$RUNNER_TEMP/android"
      - name: Web build
        run: npx expo export --clear --platform web --output-dir "$RUNNER_TEMP/web"
      - name: Check exported client credentials
        run: python3 ../scripts/check-secrets.py --artifacts "$RUNNER_TEMP/android" "$RUNNER_TEMP/web"

  admin:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: node ../scripts/check-dependencies.cjs admin
      - run: npx tsc --noEmit -p .
      # Environment flags cannot include the unsafe wallet in production.
      - run: VITE_BURNER=1 npx vite build
      - run: python3 ../scripts/check-secrets.py --artifacts dist
      - run: node ../scripts/check-build-hardening.cjs dist
