<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gali TV</title>
<meta name="description" content="Gali TV: Matt the Miner, the Gali pixel cartoon, and updates from the team. Pick a channel, pick a tape, press play.">
<meta name="theme-color" content="#120c16">
<meta property="og:title" content="Gali TV">
<meta property="og:description" content="Matt the Miner, the Gali pixel cartoon, and updates from the team.">
<meta property="og:image" content="https://gali.lol/game/logo.png">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/jersey15.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/pixelify-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preconnect" href="https://rckvfpwtdyvvvjqqlffn.supabase.co" crossorigin>
<link rel="stylesheet" href="tv.css">
</head>
<body>
<div class="sky" aria-hidden="true"><canvas id="stars"></canvas><div class="moon"></div></div>

<header class="top">
  <a class="brand" href="https://gali.lol" aria-label="Gali home">
    <img src="img/logo.png" alt="Gali" width="110" height="48">
  </a>
  <div class="wordmark" aria-hidden="true"><span class="onair"><i></i>ON AIR</span></div>
  <nav class="top-links">
    <a class="btn light sm" href="https://gali.lol"><span>← gali.lol</span></a>
    <a class="btn cyan sm" href="https://www.tiktok.com/@gali_world" target="_blank" rel="noopener"><span>Follow on TikTok</span></a>
  </nav>
</header>

<main class="stage">
  <h1 class="sr">Gali TV</h1>

  <div class="watch">
  <div class="watch-main">
  <div class="set" id="set">
    <div class="antenna" aria-hidden="true"><i class="rod l"></i><i class="rod r"></i><i class="base"></i></div>

    <div class="side-keys" aria-hidden="true"><i></i><i></i><i></i></div>
    <section class="tv" id="tv" aria-label="Gali TV player">
      <div class="phone-top" aria-hidden="true"><i class="speaker"></i><i class="cam"></i></div>
      <div class="bezel">
        <div class="screen" id="screen" data-state="boot">
          <div class="backdrop" id="backdrop"></div>
          <video id="video" playsinline preload="metadata"></video>
          <canvas class="static" id="static" width="160" height="90" aria-hidden="true"></canvas>
          <div class="testcard" id="testcard" aria-hidden="true">
            <div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
            <div class="tc-label"><b id="tc-title">STAND BY</b><span id="tc-sub">Tuning in…</span></div>
          </div>
          <div class="fx" aria-hidden="true"></div>
          <div class="osd osd-ch" id="osd-ch" aria-hidden="true">CH 01</div>
          <div class="osd osd-status" id="osd-status" aria-hidden="true"></div>
          <button class="sound-sticker" id="sound" hidden><span>🔇 Tap for sound</span></button>
          <button class="big-play" id="big-play" aria-label="Play" hidden><span>▶</span></button>
          <div class="upnext" id="upnext" hidden>
            <div class="un-label">UP NEXT IN <b id="un-count">5</b></div>
            <div class="un-title" id="un-title"></div>
            <div class="un-actions">
              <button class="btn gold sm" id="un-play"><span>Play now</span></button>
              <button class="btn light sm" id="un-cancel"><span>Stay here</span></button>
            </div>
          </div>
          <div class="power-line" aria-hidden="true"></div>
        </div>
        <div class="deck">
          <button class="ctl" id="b-prev" aria-label="Previous episode">⏮</button>
          <button class="ctl play" id="b-play" aria-label="Play">▶</button>
          <button class="ctl" id="b-next" aria-label="Next episode">⏭</button>
          <div class="seek" id="seek" role="slider" tabindex="0" aria-label="Seek" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="seek-fill" id="seek-fill"></div><div class="seek-head" id="seek-head"></div>
          </div>
          <span class="time" id="time">0:00 / 0:00</span>
          <button class="ctl" id="b-mute" aria-label="Unmute">🔇</button>
          <button class="ctl" id="b-full" aria-label="Full screen">⛶</button>
        </div>
      </div>

      <aside class="panel" aria-label="Channels">
        <div class="led" id="led" aria-hidden="true"></div>
        <div class="dial-wrap">
          <button class="dial" id="dial" aria-label="Change channel"><i></i></button>
          <div class="dial-marks" aria-hidden="true"><b data-ch="cartoon">CH1</b><b data-ch="team">CH2</b></div>
        </div>
        <div class="grille" aria-hidden="true"></div>
        <div class="brandplate" aria-hidden="true">GALI<small>VISION</small></div>
      </aside>
      <div class="feet" aria-hidden="true"><i></i><i></i></div>
      <div class="phone-bottom" aria-hidden="true"><b>SEEKER</b><i></i></div>
    </section>

  </div>

  <section class="plaque" id="plaque" aria-live="polite">
    <div class="pl-meta" id="pl-meta"><span class="chip">LOADING</span></div>
    <h2 class="pl-title" id="pl-title">Warming up the tubes…</h2>
    <p class="pl-desc" id="pl-desc"></p>
    <div class="pl-actions" id="pl-actions"></div>
  </section>

  </div>

  <aside class="playlist" aria-label="Playlists">
    <div class="pl-tabs" role="tablist" aria-label="Playlists" id="channels">
      <button role="tab" data-ch="cartoon" aria-selected="true"><em>CH 1</em>Matt the Miner</button>
      <button role="tab" data-ch="team" aria-selected="false"><em>CH 2</em>Team Updates</button>
    </div>
    <div class="series" id="series"></div>
    <ol class="eps" id="eps" aria-label="Episodes"></ol>
  </aside>
  </div>
  <p class="keys" aria-hidden="true"><kbd>Space</kbd> play · <kbd>←</kbd><kbd>→</kbd> episodes · <kbd>↑</kbd><kbd>↓</kbd> channels · <kbd>1</kbd>–<kbd>9</kbd> episode · <kbd>M</kbd> sound · <kbd>F</kbd> full screen</p>
</main>

<footer class="foot">
  <a href="https://gali.lol">gali.lol</a> · <a href="https://x.com/i/chat/group_join/g2106329104970924264/keRNMfmNp8" target="_blank" rel="noopener">Join the beta</a> · <a href="https://docs.gali.lol">Docs</a> · <a href="https://x.com/Gali_Game" target="_blank" rel="noopener">X</a> · <a href="https://www.tiktok.com/@gali_world" target="_blank" rel="noopener">TikTok</a>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="tv.js"></script>
</body>
</html>
