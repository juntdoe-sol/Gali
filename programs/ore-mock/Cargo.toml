[package]
name = "ore-mock"
version = "0.1.0"
edition = "2021"
description = "Test-only stand-in for ORE's program, so Gali's readers can be tested offline"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "ore_mock"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = "=0.31.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
