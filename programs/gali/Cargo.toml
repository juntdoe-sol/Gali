[package]
name = "gali"
version = "0.1.0"
description = "Gali: a mining game for Seeker. SOL rounds that mine SKR."
rust-version = "1.79"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "gali"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "=0.31.1", features = ["init-if-needed"] }
anchor-spl = "=0.31.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
